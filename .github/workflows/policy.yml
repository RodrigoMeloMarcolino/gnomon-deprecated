name: policy
on:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: policy-${{ github.event.pull_request.number || github.ref }}, cancel-in-progress: true}
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate versioned skills
        run: python3 .github/scripts/quick_validate_skills.py
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
