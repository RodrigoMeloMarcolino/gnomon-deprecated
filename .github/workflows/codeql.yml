name: codeql
on:
  pull_request:
    paths: ["**/*.java", "pom.xml"]
  push: {branches: [main]}
  schedule: [{cron: "17 3 * * 1"}]
permissions: {contents: read, security-events: write}
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: github/codeql-action/init@f52b05f4acaaa234e44466e66d29050e135ea9ef
        with: {languages: java-kotlin, config-file: .github/codeql/codeql-config.yml, build-mode: manual}
      - run: ./mvnw --batch-mode -DskipTests package
      - uses: github/codeql-action/analyze@f52b05f4acaaa234e44466e66d29050e135ea9ef
